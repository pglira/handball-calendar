name: Update calendar

on:
  schedule:
    - cron: "17 4,16 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build calendar
        run: python3 gaenserndorf_calendar.py -o new.ics
      # Commit only when an event changes; DTSTAMP changes on every run.
      - name: Commit changes
        run: |
          if [ -f gaenserndorf.ics ] && diff -q <(grep -v '^DTSTAMP' gaenserndorf.ics) <(grep -v '^DTSTAMP' new.ics) >/dev/null; then
            echo "No changes"; rm new.ics; exit 0
          fi
          mv new.ics gaenserndorf.ics
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add gaenserndorf.ics
          git commit -m "Update calendar"
          git push
